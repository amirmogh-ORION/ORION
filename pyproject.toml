 [build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "orion-engine"
version = "0.1.0"
description = "ORION autonomous research and decision-intelligence engine"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7,<3",
  "sqlalchemy>=2.0,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[project.scripts]
orion = "orion.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
