name: Market price snapshot
on:
  schedule:
    - cron: '17 * * * 1-5'
  workflow_dispatch:
  push:
    paths:
      - src/orion/market_snapshot.py
      - src/orion/airtable_sync.py
      - .github/workflows/market-snapshot.yml
jobs:
  snapshot:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Fetch market observations
        env:
          ORION_WATCHLIST: ${{ vars.ORION_WATCHLIST }}
          PYTHONPATH: src
        run: python -m orion.market_snapshot
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: market-snapshot
          path: reports/latest.json
          retention-days: 30
      - name: Log verified run to Airtable
        if: github.ref == 'refs/heads/main'
        env:
          ORION_AIRTABLE_BASE_ID: ${{ vars.ORION_AIRTABLE_BASE_ID }}
          ORION_AIRTABLE_TOKEN: ${{ secrets.ORION_AIRTABLE_TOKEN }}
          PYTHONPATH: src
        run: python -m orion.airtable_sync
